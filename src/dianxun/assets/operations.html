<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>店巡 · 门店运维与事件追溯中台</title>
<style>
:root{
  --bg: #070d18;
  --panel: #0e1726;
  --panel-elevated: #142033;
  --border: rgba(56, 189, 248, 0.18);
  --border-strong: rgba(56, 189, 248, 0.4);
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --cyan: #38bdf8;
  --green: #10b981;
  --amber: #f59e0b;
  --red: #ef4444;
  --purple: #a855f7;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font: 14px/1.6 system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: var(--bg);
}
body{margin:0;padding-bottom:50px}
header{background:radial-gradient(circle at 80% 0%,rgba(56,189,248,0.15) 0%,transparent 50%),#0c1422;border-bottom:1px solid var(--border);color:white;padding:24px max(24px,calc((100vw - 1200px)/2))}
h1{font-size:24px;margin:0 0 6px;display:flex;align-items:center;gap:10px}
.subtitle{color:var(--text-muted);font-size:13px}
main{max-width:1200px;margin:auto;padding:24px}
form,.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:18px;box-shadow:0 4px 20px rgba(0,0,0,0.25)}
label{display:inline-block;margin:0 14px 10px 0}
input,button{font:inherit;padding:8px 14px;border:1px solid #334155;border-radius:6px;background:#1e293b;color:#f8fafc}
button{cursor:pointer;background:rgba(56,189,248,0.12);color:var(--cyan);border-color:rgba(56,189,248,0.3);font-weight:500;transition:all 0.15s ease}
button:hover{background:rgba(56,189,248,0.22);border-color:var(--cyan)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:18px}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.cards button{text-align:left;max-width:100%;overflow-wrap:anywhere}
h2{font-size:17px;margin:0 0 14px;color:#fff;display:flex;align-items:center;justify-content:space-between}
h3{font-size:15px;margin:14px 0 8px;color:var(--cyan)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:rgba(15,23,42,0.8);color:var(--text-muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:0.05em;border-bottom:1px solid #334155;padding:10px 12px}
td{border-bottom:1px solid rgba(255,255,255,0.06);padding:10px 12px;text-align:left;overflow-wrap:anywhere}
tr:hover td{background:rgba(56,189,248,0.03)}
.scroll{overflow:auto;border-radius:6px;border:1px solid rgba(255,255,255,0.06)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--font-mono);font-size:12px;background:#060b13;color:#e2e8f0;padding:14px;border-radius:6px;border:1px solid rgba(255,255,255,0.05)}
details{margin:8px 0;border:1px solid rgba(255,255,255,0.06);border-radius:6px;padding:8px 12px;background:rgba(0,0,0,0.15)}
summary{cursor:pointer;font-weight:500;color:#cbd5e1;user-select:none}
summary:hover{color:var(--cyan)}
.muted{color:var(--text-muted)}
.error{color:var(--red)}
.success{color:var(--green)}
.warning{color:var(--amber)}
#status{min-height:24px;margin-bottom:12px}
small{font-size:12px}
a{color:var(--cyan)}

/* Badges */
.badge-bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;border:1px solid transparent}
.badge-virtual{background:rgba(245,158,11,0.15);color:#fbbf24;border-color:rgba(245,158,11,0.35)}
.badge-live{background:rgba(16,185,129,0.15);color:#34d399;border-color:rgba(16,185,129,0.35)}
.badge-scenario{background:rgba(99,102,241,0.15);color:#a5b4fc;border-color:rgba(99,102,241,0.35)}
.badge-db{background:rgba(56,189,248,0.15);color:#7dd3fc;border-color:rgba(56,189,248,0.35)}
.badge-sha{background:rgba(148,163,184,0.12);color:#cbd5e1;border-color:rgba(148,163,184,0.25);font-family:var(--font-mono)}
.badge-danger{background:rgba(239,68,68,0.15);color:#f87171;border-color:rgba(239,68,68,0.35)}

/* Dual Track Banner */
.dual-track{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0;padding:16px;background:var(--panel-elevated);border-radius:8px;border:1px solid var(--border-strong)}
.track-card{padding:14px;border-radius:6px;background:rgba(0,0,0,0.25);border-left:4px solid var(--cyan)}
.track-card.device-track{border-left-color:var(--cyan)}
.track-card.goods-track{border-left-color:var(--amber)}
.track-card.goods-track.rejected{border-left-color:var(--red)}
.track-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px}
.track-val{font-size:18px;font-weight:700;color:#fff;margin-bottom:4px}
.track-desc{font-size:12px;color:var(--text-muted);line-height:1.5}

/* Attribution Grid */
.attr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.attr-card{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:10px 14px}
.attr-k{font-size:11px;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.04em}
.attr-v{font-size:14px;font-weight:600;color:#fff;margin-top:4px;word-break:break-all}

/* Callout */
.callout{padding:12px 16px;border-radius:6px;margin:12px 0;font-size:13px;display:flex;align-items:center;gap:10px}
.callout-warning{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:#fde68a}
.callout-danger{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}
.callout-success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:#a7f3d0}
</style><script src="/operations.js" defer></script></head>
<body><header><h1>店巡 · 门店运维与事件追溯中台</h1><div class="subtitle">面向物理实体流程的可验证多智能体运行时 · 设备、商品、执行与复核共用不可篡改事件档案</div></header>
<main>
<form id="connect"><label>运行身份 Token <input id="token" type="password" autocomplete="off" required></label>
<button type="submit">读取门店事件</button> <button id="disconnect" type="button">退出并清空</button>
<div class="muted" style="margin-top:8px">使用运行时分配的独立身份凭证；凭证仅在当前页面内存中保留，严禁明文持久化。</div></form>
<div id="status" role="status" aria-live="polite"></div>
<section class="panel"><h2>门店事件档案库</h2><div id="cases" class="cards"></div><button id="more" hidden>加载下一页</button></section>
<section id="casefile" hidden></section>
</main></body></html>
